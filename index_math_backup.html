<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맞춤형 수학 학습지 자동 생성기 - 진영대창초등학교 4학년 1반</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================================
       1. 기본 스타일 리셋 및 공통 변수
       ========================================================= */
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --accent-light: #fef2f2;
      --success: #10b981;
      --success-hover: #059669;
      --bg-gray: #f1f5f9;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --sheet-width: 210mm;
      --sheet-min-height: 297mm;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* =========================================================
       2. 컨트롤 패널 (선생님 조작 영역 - 화면 전용)
       ========================================================= */
    .control-panel {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      padding: 16px 24px;
    }

    .panel-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
    }

    .panel-title .badge {
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
    }

    /* 컨트롤 폼 레이아웃 */
    .panel-controls {
      display: grid;
      grid-template-columns: minmax(260px, 2fr) repeat(3, minmax(110px, 1fr)) auto;
      gap: 12px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .form-control {
      width: 100%;
      height: 42px;
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background-color: #f8fafc;
      color: #0f172a;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* 버튼 그룹 */
    .button-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      height: 42px;
      padding: 0 16px;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-accent {
      background-color: #ffffff;
      color: var(--accent);
      border: 1.5px solid var(--accent);
    }
    .btn-accent:hover {
      background-color: var(--accent-light);
    }
    .btn-accent.active {
      background-color: var(--accent);
      color: white;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }

    .btn-success {
      background-color: var(--success);
      color: white;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }
    .btn-success:hover {
      background-color: var(--success-hover);
    }

    /* 빠른 추천 예시 배지 */
    .preset-container {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.8rem;
    }

    .preset-label {
      font-weight: 700;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .preset-chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      transition: all 0.15s;
    }

    .preset-chip:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
      color: #0f172a;
    }

    /* 세부 옵션 체크박스 */
    .options-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.82rem;
      color: #475569;
      padding-top: 2px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .option-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* 패턴 분석 결과 안내 바 */
    .pattern-info-bar {
      font-size: 0.82rem;
      color: #0369a1;
      background: #f0f9ff;
      border-left: 3px solid #0284c7;
      padding: 6px 12px;
      border-radius: 0 6px 6px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* =========================================================
       3. A4 학습지 본문 (출력 및 인쇄 영역)
       ========================================================= */
    .sheet-wrapper {
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .a4-sheet {
      width: var(--sheet-width);
      min-height: var(--sheet-min-height);
      background: #ffffff;
      padding: 16mm 14mm 16mm 14mm;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 학습지 고정 헤더 */
    .sheet-header {
      border-bottom: 2.5px solid #0f172a;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .sheet-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 6px;
    }

    /* 필수 고정 문구: 진영대창초등학교 4학년 1반 */
    .school-info {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }

    .student-info-box {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
    }

    .info-field {
      display: inline-flex;
      align-items: center;
    }

    .info-underline {
      display: inline-block;
      min-width: 80px;
      border-bottom: 1.5px solid #0f172a;
      margin-left: 4px;
      height: 18px;
    }

    .info-underline.name-field {
      min-width: 100px;
    }

    .sheet-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .sheet-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      outline: none;
      border-bottom: 1px dashed transparent;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .sheet-title:focus {
      background: #eff6ff;
      border-color: var(--primary);
    }

    .score-box {
      border: 1.5px solid #334155;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
      background: #f8fafc;
    }

    /* =========================================================
       4. 문제 그리드 배치 (1단 ~ 4단)
       ========================================================= */
    .problems-grid {
      display: grid;
      gap: 20px 24px;
      flex-grow: 1;
      align-content: start;
    }

    .cols-1 { grid-template-columns: 1fr; }
    .cols-2 { grid-template-columns: repeat(2, 1fr); }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }

    /* 개별 문제 카드 */
    .problem-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-inside: avoid;
      break-inside: avoid;
      position: relative;
    }

    /* 여백 크기 조절 옵션 */
    .space-compact .problem-card { min-height: 85px; padding: 8px 10px; }
    .space-normal .problem-card  { min-height: 120px; padding: 12px 14px; }
    .space-wide .problem-card    { min-height: 160px; padding: 16px 16px; }

    .problem-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }

    .problem-num {
      color: #2563eb;
      font-size: 1.05rem;
      font-weight: 800;
      min-width: 24px;
    }

    .problem-expr {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 분수 표현 (초등학교 수식 표준 스타일) */
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      font-size: 0.95em;
      line-height: 1.1;
      margin: 0 2px;
    }

    .math-frac .num {
      border-bottom: 1.5px solid currentColor;
      padding: 0 3px 1px 3px;
      font-weight: 700;
    }

    .math-frac .den {
      padding: 1px 3px 0 3px;
      font-weight: 700;
    }

    .math-op {
      margin: 0 4px;
      font-weight: 700;
      font-size: 1.1em;
    }

    /* 문제 풀이 공간 */
    .problem-work-space {
      flex-grow: 1;
      margin: 8px 0;
    }

    /* 답안 기입란 */
    .problem-answer-line {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      margin-top: 6px;
      border-top: 1px dashed #cbd5e1;
      padding-top: 6px;
    }

    .answer-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 90px;
      height: 28px;
      border-bottom: 1.5px solid #64748b;
      padding: 0 8px;
      font-weight: 800;
    }

    /* 정답 표시 스타일 (빨간색 펜 채점 모드) */
    .answer-val {
      display: none;
      color: #dc2626;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .show-answers .answer-val {
      display: inline-flex;
      align-items: center;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* 학습지 하단 푸터 */
    .sheet-footer {
      margin-top: 24px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* =========================================================
       5. 인쇄 및 PDF 최적화 (@media print)
       ========================================================= */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm 10mm 12mm 10mm;
      }

      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }

      /* 컨트롤 패널 등 화면 전용 UI 완전 숨김 */
      .no-print,
      .control-panel {
        display: none !important;
      }

      .sheet-wrapper {
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .a4-sheet {
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
      }

      /* 페이지 나눔 방지 (문제가 반으로 잘리는 현상 방지) */
      .problem-card {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        border: 1px solid #94a3b8 !important;
      }

      .sheet-header {
        border-bottom: 2px solid #000000 !important;
      }

      /* 브라우저 기본 인쇄 색상 강제 유지 */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* 정답 표시 인쇄 시 빨간색 유지 */
      .show-answers .answer-val {
        color: #dc2626 !important;
      }
    }

    /* 반응형 모바일/태블릿 */
    @media (max-width: 900px) {
      .panel-controls {
        grid-template-columns: 1fr 1fr;
      }
      .panel-controls .button-group {
        grid-column: span 2;
        justify-content: stretch;
      }
      .button-group .btn {
        flex: 1;
      }
      .sheet-wrapper {
        overflow-x: auto;
      }
      .a4-sheet {
        zoom: 0.85;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       1. 컨트롤 패널 (인쇄 시 자동 숨김)
       ========================================================= -->
  <header class="control-panel no-print">
    <div class="panel-inner">
      
      <!-- 패널 상단 제목 -->
      <div class="panel-header">
        <div class="panel-title">
          <span>📐 맞춤형 수학 학습지 자동 생성기</span>
          <span class="badge">진영대창초 4-1 맞춤형</span>
        </div>
        <div class="pattern-info-bar" id="patternNotice">
          💡 예시 문제를 입력하면 동일한 유형과 난이도로 문제를 즉시 만듭니다.
        </div>
      </div>

      <!-- 컨트롤 폼 -->
      <div class="panel-controls">
        
        <!-- 예시 문제 입력란 -->
        <div class="form-group">
          <label for="exampleInput">
            <span>✏️ 예시 문제 입력</span>
          </label>
          <input 
            type="text" 
            id="exampleInput" 
            class="form-control" 
            value="12 + 34" 
            placeholder="예: 12+34, 5.2-1.4, 3/4+1/2, 10*5, 144/4"
            autocomplete="off"
          >
        </div>

        <!-- 문제 개수 설정 -->
        <div class="form-group">
          <label for="countInput">
            <span>🔢 문제 개수</span>
          </label>
          <input 
            type="number" 
            id="countInput" 
            class="form-control" 
            value="20" 
            min="1" 
            max="60"
          >
        </div>

        <!-- 단(열) 설정 -->
        <div class="form-group">
          <label for="columnsSelect">
            <span>📑 문제지 단(열)</span>
          </label>
          <select id="columnsSelect" class="form-control">
            <option value="1">1단 (넓게)</option>
            <option value="2" selected>2단 (기본)</option>
            <option value="3">3단 (조밀)</option>
            <option value="4">4단 (다단)</option>
          </select>
        </div>

        <!-- 풀이 여백 설정 -->
        <div class="form-group">
          <label for="spacingSelect">
            <span>📐 풀이 여백</span>
          </label>
          <select id="spacingSelect" class="form-control">
            <option value="compact">좁게</option>
            <option value="normal" selected>보통</option>
            <option value="wide">넓게</option>
          </select>
        </div>

        <!-- 주요 실행 버튼들 -->
        <div class="button-group">
          <button type="button" id="generateBtn" class="btn btn-primary" title="새로운 문제 생성">
            <span>🚀 문제지 생성</span>
          </button>
          <button type="button" id="toggleAnswerBtn" class="btn btn-accent" title="정답 빨간 글씨 토글">
            <span>👁️ 정답 보기</span>
          </button>
          <button type="button" id="printBtn" class="btn btn-success" title="A4 인쇄 또는 PDF 저장">
            <span>🖨️ 인쇄하기 (PDF)</span>
          </button>
        </div>

      </div>

      <!-- 빠른 예시 문제 프리셋 칩 -->
      <div class="preset-container">
        <span class="preset-label">자주 쓰는 예시:</span>
        <button type="button" class="preset-chip" data-ex="25 + 38">두 자리+두 자리</button>
        <button type="button" class="preset-chip" data-ex="342 - 58">세 자리-두 자리</button>
        <button type="button" class="preset-chip" data-ex="43 * 6">두 자리×한 자리</button>
        <button type="button" class="preset-chip" data-ex="144 / 4">세 자리÷한 자리</button>
        <button type="button" class="preset-chip" data-ex="3.4 + 2.8">소수 한 자리 덧셈</button>
        <button type="button" class="preset-chip" data-ex="5.72 - 2.35">소수 두 자리 뺄셈</button>
        <button type="button" class="preset-chip" data-ex="2/7 + 3/7">동분모 분수 덧셈</button>
        <button type="button" class="preset-chip" data-ex="3/4 - 1/2">이분모 분수 뺄셈</button>
        <button type="button" class="preset-chip" data-ex="12 + 8 * 3">혼합 계산</button>
      </div>

      <!-- 세부 옵션 체크박스 -->
      <div class="options-row">
        <label class="option-item" title="초등 수학 범위에 맞게 음수가 나오지 않도록 큰 수에서 작은 수를 뺍니다.">
          <input type="checkbox" id="preventNegative" checked>
          <span>음수 결과 방지 (초등 4학년 맞춤)</span>
        </label>
        <label class="option-item" title="나눗셈 문제 생성 시 나머지가 없이 깔끔하게 나누어떨어지도록 생성합니다.">
          <input type="checkbox" id="exactDivision" checked>
          <span>나눗셈 딱 떨어지게 생성</span>
        </label>
      </div>

    </div>
  </header>

  <!-- =========================================================
       2. A4 학습지 영역 (화면 프리뷰 및 인쇄 출력부)
       ========================================================= -->
  <main class="sheet-wrapper">
    <article class="a4-sheet space-normal" id="sheetArea">
      
      <!-- 학습지 고정 헤더 -->
      <header class="sheet-header">
        <div class="sheet-top-meta">
          <!-- 요구사항 고정 텍스트 -->
          <div class="school-info">진영대창초등학교 4학년 1반</div>
          
          <div class="student-info-box">
            <span class="info-field">날짜: <span class="info-underline"></span></span>
            <span class="info-field">번호: <span class="info-underline" style="min-width:40px;"></span></span>
            <span class="info-field">이름: <span class="info-underline name-field"></span></span>
          </div>
        </div>

        <div class="sheet-title-row">
          <h1 class="sheet-title" contenteditable="true" title="클릭하여 학습지 제목을 직접 수정할 수 있습니다.">

  <!-- =========================================================
       3. 핵심 알고리즘 및 Vanilla JavaScript
       ========================================================= -->
  <script>
    /* ---------------------------------------------------------
       유틸리티: 최대공약수(GCD) 및 난수 생성
       --------------------------------------------------------- */
    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /* ---------------------------------------------------------
       1. 수식 패턴 분석기 (Pattern Parser)
       입력된 예시 문자열을 분석하여 연산자 및 피연산자의 패턴을 추출
       --------------------------------------------------------- */
    class MathPatternAnalyzer {
      static analyze(inputStr) {
        if (!inputStr || !inputStr.trim()) {
          return null;
        }

        // 공백 정규화 및 곱하기/나누기 기호 통일
        let s = inputStr.trim()
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/\s+/g, ' ');

        // 수식 토큰화: 분수, 소수, 정수, 연산자, 괄호 파싱
        // 분수 판별 규칙: a/b 형태가 있고 다른 연산자가 있거나 분수 패턴일 때
        const fractionRegex = /\b(\d+)\s*\/\s*(\d+)\b/g;
        const hasOtherOps = /[+\-*]/.test(s);
        const slashCount = (s.match(/\//g) || []).length;
        const isFractionContext = hasOtherOps || slashCount >= 2;

        const tokens = [];
        let cursor = 0;

        while (cursor < s.length) {
          const char = s[cursor];

          if (char === ' ') {
            cursor++;
            continue;
          }

          // 괄호
          if (char === '(' || char === ')') {
            tokens.push({ type: 'paren', value: char });
            cursor++;
            continue;
          }

          // 사칙연산자 (+, -, *)
          if (char === '+' || char === '-' || char === '*') {
            tokens.push({ type: 'operator', value: char });
            cursor++;
            continue;
          }

          // 숫자 또는 분수/나눗셈 파싱
          const numMatch = s.slice(cursor).match(/^(\d+(?:\.\d+)?)/);
          if (numMatch) {
            const rawNum = numMatch[1];
            const afterNumIndex = cursor + rawNum.length;

            // 슬래시가 바로 뒤에 오는지 확인 (분수 vs 나눗셈)
            const slashMatch = s.slice(afterNumIndex).match(/^\s*\/\s*(\d+)/);
            if (slashMatch) {
              const denStr = slashMatch[1];
              const fullMatchLen = slashMatch[0].length;

              // 분수인지 나눗셈인지 구분
              // 만약 식에 다른 연산자가 있거나(/가 2개 이상), 또는 num < den 이면 분수로 인식
              const numVal = parseFloat(rawNum);
              const denVal = parseInt(denStr, 10);
              const isFraction = isFractionContext || (numVal < denVal);

              if (isFraction) {
                // 분수 토큰 등록
                const numDigits = rawNum.length;
                const denDigits = denStr.length;
                tokens.push({
                  type: 'fraction',
                  sampleNum: parseInt(rawNum, 10),
                  sampleDen: denVal,
                  numDigits: numDigits,
                  denDigits: denDigits,
                  isProper: parseInt(rawNum, 10) < denVal
                });
                cursor = afterNumIndex + fullMatchLen;
                continue;
              } else {
                // 단순 나눗셈 연산자로 취급 (a ÷ b)
                if (rawNum.includes('.')) {
                  tokens.push(this.createDecimalToken(rawNum));
                } else {
                  tokens.push(this.createIntegerToken(rawNum));
                }
                tokens.push({ type: 'operator', value: '/' });
                cursor = afterNumIndex + slashMatch[0].indexOf('/') + 1;
                continue;
              }
            }

            // 일반 소수 또는 정수
            if (rawNum.includes('.')) {
              tokens.push(this.createDecimalToken(rawNum));
            } else {
              tokens.push(this.createIntegerToken(rawNum));
            }
            cursor = afterNumIndex;
            continue;
          }

          // 단순 슬래시 연산자 (나눗셈)
          if (char === '/') {
            tokens.push({ type: 'operator', value: '/' });
            cursor++;
            continue;
          }

          cursor++;
        }

        // 분수들의 공통 분모 여부 파악 (초등 동분모 덧셈/뺄셈 감지)
        const fractions = tokens.filter(t => t.type === 'fraction');
        let hasSameDenominator = false;
        if (fractions.length >= 2) {
          const firstDen = fractions[0].sampleDen;
          hasSameDenominator = fractions.every(f => f.sampleDen === firstDen);
        }

        return {
          original: inputStr,
          tokens: tokens,
          fractionsCount: fractions.length,
          hasSameDenominator: hasSameDenominator,
          operators: tokens.filter(t => t.type === 'operator').map(t => t.value)
        };
      }

      static createIntegerToken(numStr) {
        return {
          type: 'integer',
          digits: numStr.length,
          sampleValue: parseInt(numStr, 10)
        };
      }

      static createDecimalToken(numStr) {
        const parts = numStr.split('.');
        return {
          type: 'decimal',
          intDigits: parts[0].length,
          decDigits: parts[1].length,
          isIntZero: parts[0] === '0',
          sampleValue: parseFloat(numStr)
        };
      }
    }

    /* ---------------------------------------------------------
       2. 문제 생성 엔진 (Problem Generator)
       분석된 패턴에 맞춰 난수를 발생시키고 정답을 계산
       --------------------------------------------------------- */
    class ProblemGenerator {
      constructor(patternInfo, options = {}) {
        this.pattern = patternInfo;
        this.preventNegative = options.preventNegative !== false;
        this.exactDivision = options.exactDivision !== false;
      }

      generate(count = 20) {
        const problems = [];
        const seenProblems = new Set();
        let attempts = 0;
        const maxAttempts = count * 20;

        while (problems.length < count && attempts < maxAttempts) {
          attempts++;
          const problem = this.createSingleProblem();
          if (!problem) continue;

          // 중복 방지 (식 문자열 기준)
          const key = problem.exprPlain;
          if (!seenProblems.has(key)) {
            seenProblems.add(key);
            problems.push(problem);
          }
        }

        // 만약 난수 조합이 적어 중복 방지가 걸리면 남은 개수 채우기
        while (problems.length < count) {
          const fallback = this.createSingleProblem();
          if (fallback) problems.push(fallback);
          else break;
        }

        return problems;
      }

      createSingleProblem() {
        const { tokens, hasSameDenominator } = this.pattern;
        
        // 동분모 패턴일 경우 이번 문제에서 공통으로 쓸 분모 결정 (2~9 사이 또는 자릿수에 맞춤)
        let sharedDen = null;
        if (hasSameDenominator && this.pattern.fractionsCount > 0) {
          const sampleFrac = tokens.find(t => t.type === 'fraction');
          const dDigits = sampleFrac ? sampleFrac.denDigits : 1;
          const minDen = dDigits === 1 ? 3 : Math.pow(10, dDigits - 1);
          const maxDen = Math.pow(10, dDigits) - 1;
          sharedDen = getRandomInt(minDen, maxDen);
        }

        // 나눗셈 딱 떨어지게 생성하기 위한 사전 처리 (A / B 형태)
        const isSimpleDivision = tokens.length === 3 && 
                                tokens[1].type === 'operator' && 
                                tokens[1].value === '/' && 
                                this.exactDivision;

        if (isSimpleDivision) {
          return this.createExactDivisionProblem(tokens);
        }

        // 각 토큰별 인스턴스 값 생성
        const genTokens = [];
        for (const token of tokens) {
          if (token.type === 'integer') {
            const val = this.generateInteger(token.digits);
            genTokens.push({ type: 'integer', value: val, display: String(val) });
          } else if (token.type === 'decimal') {
            const val = this.generateDecimal(token.intDigits, token.decDigits, token.isIntZero);
            genTokens.push({ type: 'decimal', value: val, display: String(val) });
          } else if (token.type === 'fraction') {
            const frac = this.generateFraction(token, sharedDen);
            genTokens.push({
              type: 'fraction',
              num: frac.num,
              den: frac.den,
              display: `${frac.num}/${frac.den}`
            });
          } else {
            // 연산자 또는 괄호
            genTokens.push({ ...token });
          }
        }

        // 뺄셈 음수 방지 보정 (A - B 형태)
        if (this.preventNegative && genTokens.length === 3 && genTokens[1].type === 'operator' && genTokens[1].value === '-') {
          const t0 = genTokens[0];
          const t2 = genTokens[2];

          if (t0.type === 'integer' || t0.type === 'decimal') {
            if (t0.value < t2.value) {
              // 값 맞바꾸기
              const temp = t0.value;
              t0.value = t2.value;
              t0.display = String(t0.value);
              t2.value = temp;
              t2.display = String(t2.value);
            }
          } else if (t0.type === 'fraction' && t2.type === 'fraction') {
            const val0 = t0.num / t0.den;
            const val2 = t2.num / t2.den;
            if (val0 < val2) {
              const tempNum = t0.num; const tempDen = t0.den;
              t0.num = t2.num; t0.den = t2.den;
              t0.display = `${t0.num}/${t0.den}`;
              t2.num = tempNum; t2.den = tempDen;
              t2.display = `${t2.num}/${t2.den}`;
            }
          }
        }

        // 수식 텍스트 및 HTML 표현 생성
        const { exprPlain, exprHtml } = this.formatExpression(genTokens);
        
        // 정답 계산
        const answer = this.calculateAnswer(genTokens);

        return {
          exprPlain,
          exprHtml,
          answer: answer.display,
          answerHtml: answer.html || answer.display
        };
      }

      /* 나눗셈 나누어떨어짐 보장 생성 로직 */
      createExactDivisionProblem(tokens) {
        const tokenA = tokens[0];
        const tokenB = tokens[2];

        // B(나누는 수) 생성
        const bDigits = tokenB.digits || 1;
        const bMin = bDigits === 1 ? 2 : Math.pow(10, bDigits - 1);
        const bMax = Math.pow(10, bDigits) - 1;
        const B = getRandomInt(bMin, bMax);

        // A의 목표 자릿수
        const aDigits = tokenA.digits || 2;
        const aMin = Math.pow(10, aDigits - 1);
        const aMax = Math.pow(10, aDigits) - 1;

        // A = B * Q 가 되도록 몫 Q의 범위 산출
        const qMin = Math.max(1, Math.ceil(aMin / B));
        const qMax = Math.floor(aMax / B);

        let Q;
        if (qMin <= qMax) {
          Q = getRandomInt(qMin, qMax);
        } else {
          Q = getRandomInt(2, 9);
        }

        const A = B * Q;

        const exprPlain = `${A} ÷ ${B}`;
        const exprHtml = `<span>${A}</span><span class="math-op">÷</span><span>${B}</span>`;

        return {
          exprPlain,
          exprHtml,
          answer: String(Q),
          answerHtml: String(Q)
        };
      }

      generateInteger(digits) {
        if (digits <= 1) return getRandomInt(1, 9);
        const min = Math.pow(10, digits - 1);
        const max = Math.pow(10, digits) - 1;
        return getRandomInt(min, max);
      }

      generateDecimal(intDigits, decDigits, isIntZero) {
        let intPart = 0;
        if (!isIntZero) {
          intPart = this.generateInteger(intDigits);
        }
        
        // 소수부 생성 (끝자리 0 방지)
        const decMin = 1;
        const decMax = Math.pow(10, decDigits) - 1;
        const decVal = getRandomInt(decMin, decMax);
        const decStr = String(decVal).padStart(decDigits, '0');
        
        return parseFloat(`${intPart}.${decStr}`);
      }

      generateFraction(token, sharedDen) {
        const denDigits = token.denDigits || 1;
        let den = sharedDen;
        if (!den) {
          const dMin = denDigits === 1 ? 3 : Math.pow(10, denDigits - 1);
          const dMax = Math.pow(10, denDigits) - 1;
          den = getRandomInt(dMin, dMax);
        }

        let num;
        if (token.isProper) {
          // 진분수 (1 <= num < den)
          num = getRandomInt(1, Math.max(1, den - 1));
        } else {
          // 가분수 (den <= num)
          num = getRandomInt(den, den * 2);
        }

        return { num, den };
      }

      formatExpression(tokens) {
        let plain = '';
        let html = '';

        for (let i = 0; i < tokens.length; i++) {
          const t = tokens[i];

          if (t.type === 'fraction') {
            plain += `${t.num}/${t.den} `;
            html += `<span class="math-frac"><span class="num">${t.num}</span><span class="den">${t.den}</span></span>`;
          } else if (t.type === 'operator') {
            const opSign = t.value === '*' ? '×' : (t.value === '/' ? '÷' : t.value);
            plain += `${opSign} `;
            html += `<span class="math-op">${opSign}</span>`;
          } else if (t.type === 'paren') {
            plain += `${t.value} `;
            html += `<span class="math-paren">${t.value}</span>`;
          } else {
            plain += `${t.display} `;
            html += `<span>${t.display}</span>`;
          }
        }

        return {
          exprPlain: plain.trim(),
          exprHtml: html
        };
      }

      /* 정답 계산기 */
      calculateAnswer(tokens) {
        // 1. 모든 피연산자가 분수인 경우 (초등 분수 연산)
        const hasFraction = tokens.some(t => t.type === 'fraction');
        if (hasFraction && tokens.length === 3 && tokens[1].type === 'operator') {
          return this.calculateFractionAnswer(tokens[0], tokens[1].value, tokens[2]);
        }

        // 2. 일반 정수 / 소수 / 혼합 계산식 평가
        try {
          // 자바스크립트 수식으로 환산
          let jsExpr = '';
          for (const t of tokens) {
            if (t.type === 'operator') {
              jsExpr += ` ${t.value} `;
            } else if (t.type === 'paren') {
              jsExpr += t.value;
            } else if (t.type === 'fraction') {
              jsExpr += ` (${t.num}/${t.den}) `;
            } else {
              jsExpr += t.value;
            }
          }

          // 안전한 계산 (Shunting-yard 기반)
          const result = this.evaluateArithmetic(jsExpr);
          
          // 부동소수점 오차 보정
          let formatted;
          if (Number.isInteger(result)) {
            formatted = String(result);
          } else {
            // 소수점 4자리까지 반올림 후 뒤쪽 0 제거
            formatted = String(parseFloat(result.toFixed(4)));
          }

          return { display: formatted, html: formatted };
        } catch (e) {
          return { display: '?', html: '?' };
        }
      }

      /* 분수 산술 계산 (기약분수 및 대분수 표기 지원) */
      calculateFractionAnswer(f1, op, f2) {
        let num1 = f1.num, den1 = f1.den;
        let num2 = f2.num, den2 = f2.den;
        let ansNum = 0, ansDen = 1;

        if (op === '+') {
          ansNum = num1 * den2 + num2 * den1;
          ansDen = den1 * den2;
        } else if (op === '-') {
          ansNum = num1 * den2 - num2 * den1;
          ansDen = den1 * den2;
        } else if (op === '*') {
          ansNum = num1 * num2;
          ansDen = den1 * den2;
        } else if (op === '/') {
          ansNum = num1 * den2;
          ansDen = den1 * num2;
        }

        if (ansNum === 0) {
          return { display: '0', html: '0' };
        }

        // 약분
        const g = gcd(ansNum, ansDen);
        ansNum /= g;
        ansDen /= g;

        if (ansDen === 1) {
          return { display: String(ansNum), html: String(ansNum) };
        }

        // 대분수 변환 (가분수일 때)
        if (ansNum > ansDen) {
          const whole = Math.floor(ansNum / ansDen);
          const rem = ansNum % ansDen;
          const display = `${whole}과 ${rem}/${ansDen} (${ansNum}/${ansDen})`;
          const html = `<span>${whole}</span><span class="math-frac"><span class="num">${rem}</span><span class="den">${ansDen}</span></span> <span style="font-size:0.85em; color:#64748b;">(${ansNum}/${ansDen})</span>`;
          return { display, html };
        }

        const display = `${ansNum}/${ansDen}`;
        const html = `<span class="math-frac"><span class="num">${ansNum}</span><span class="den">${ansDen}</span></span>`;
        return { display, html };
      }

      /* 안전한 사칙연산 계산기 (Shunting-yard 알고리즘) */
      evaluateArithmetic(expr) {
        const ops = {
          '+': (a, b) => a + b,
          '-': (a, b) => a - b,
          '*': (a, b) => a * b,
          '/': (a, b) => a / b
        };
        const precedence = { '+': 1, '-': 1, '*': 2, '/': 2 };

        const outputQueue = [];
        const opStack = [];

        // 토큰 추출
        const tokenRegex = /\d+(?:\.\d+)?|[+\-*/()]/g;
        let match;
        const tokens = [];
        while ((match = tokenRegex.exec(expr)) !== null) {
          tokens.push(match[0]);
        }

        for (const token of tokens) {
          if (!isNaN(parseFloat(token))) {
            outputQueue.push(parseFloat(token));
          } else if (token in ops) {
            while (
              opStack.length &&
              opStack[opStack.length - 1] in ops &&
              precedence[opStack[opStack.length - 1]] >= precedence[token]
            ) {
              outputQueue.push(opStack.pop());
            }
            opStack.push(token);
          } else if (token === '(') {
            opStack.push(token);
          } else if (token === ')') {
            while (opStack.length && opStack[opStack.length - 1] !== '(') {
              outputQueue.push(opStack.pop());
            }
            opStack.pop(); // '(' 제거
          }
        }

        while (opStack.length) {
          outputQueue.push(opStack.pop());
        }

        // RPN 계산
        const evalStack = [];
        for (const token of outputQueue) {
          if (typeof token === 'number') {
            evalStack.push(token);
          } else if (token in ops) {
            const b = evalStack.pop();
            const a = evalStack.pop();
            evalStack.push(ops[token](a, b));
          }
        }

        return evalStack[0] || 0;
      }
    }

    /* ---------------------------------------------------------
       3. UI 컨트롤러 및 이벤트 바인딩
       --------------------------------------------------------- */
    class WorksheetApp {
      constructor() {
        this.dom = {
          exampleInput: document.getElementById('exampleInput'),
          countInput: document.getElementById('countInput'),
          columnsSelect: document.getElementById('columnsSelect'),
          spacingSelect: document.getElementById('spacingSelect'),
          preventNegative: document.getElementById('preventNegative'),
          exactDivision: document.getElementById('exactDivision'),
          generateBtn: document.getElementById('generateBtn'),
          toggleAnswerBtn: document.getElementById('toggleAnswerBtn'),
          printBtn: document.getElementById('printBtn'),
          patternNotice: document.getElementById('patternNotice'),
          sheetArea: document.getElementById('sheetArea'),
          problemsContainer: document.getElementById('problemsContainer'),
          presetChips: document.querySelectorAll('.preset-chip')
        };

        this.isAnswerVisible = false;
        this.currentProblems = [];

        this.initEvents();
        this.generateWorksheet();
      }

      initEvents() {
        // 생성 버튼
        this.dom.generateBtn.addEventListener('click', () => this.generateWorksheet());

        // 엔터키 입력 시 자동 생성
        this.dom.exampleInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            this.generateWorksheet();
          }
        });

        // 정답지 보기 토글 버튼
        this.dom.toggleAnswerBtn.addEventListener('click', () => this.toggleAnswers());

        // 인쇄 버튼 (PDF 저장)
        this.dom.printBtn.addEventListener('click', () => {
          window.print();
        });

        // 열(단) 설정 변경
        this.dom.columnsSelect.addEventListener('change', (e) => {
          this.updateColumns(e.target.value);
        });

        // 풀이 여백 설정 변경
        this.dom.spacingSelect.addEventListener('change', (e) => {
          this.updateSpacing(e.target.value);
        });

        // 추천 예시 칩 클릭
        this.dom.presetChips.forEach(chip => {
          chip.addEventListener('click', (e) => {
            const ex = e.target.getAttribute('data-ex');
            if (ex) {
              this.dom.exampleInput.value = ex;
              this.generateWorksheet();
            }
          });
        });
      }

      updateColumns(colCount) {
        this.dom.problemsContainer.className = `problems-grid cols-${colCount}`;
      }

      updateSpacing(spacingClass) {
        this.dom.sheetArea.classList.remove('space-compact', 'space-normal', 'space-wide');
        this.dom.sheetArea.classList.add(`space-${spacingClass}`);
      }

      toggleAnswers() {
        this.isAnswerVisible = !this.isAnswerVisible;
        if (this.isAnswerVisible) {
          this.dom.sheetArea.classList.add('show-answers');
          this.dom.toggleAnswerBtn.classList.add('active');
          this.dom.toggleAnswerBtn.innerHTML = '<span>🙈 정답 숨기기</span>';
        } else {
          this.dom.sheetArea.classList.remove('show-answers');
          this.dom.toggleAnswerBtn.classList.remove('active');
          this.dom.toggleAnswerBtn.innerHTML = '<span>👁️ 정답 보기</span>';
        }
      }

      generateWorksheet() {
        const rawInput = this.dom.exampleInput.value.trim();
        if (!rawInput) {
          alert('예시 문제를 입력해 주세요! (예: 12 + 34)');
          this.dom.exampleInput.focus();
          return;
        }

        // 패턴 분석
        const pattern = MathPatternAnalyzer.analyze(rawInput);
        if (!pattern || pattern.tokens.length === 0) {
          alert('올바른 수학 수식 패턴을 인식하지 못했습니다. 다시 확인해 주세요.');
          return;
        }

        // 문제 개수 및 옵션
        const count = parseInt(this.dom.countInput.value, 10) || 20;
        const options = {
          preventNegative: this.dom.preventNegative.checked,
          exactDivision: this.dom.exactDivision.checked
        };

        // 패턴 안내 메시지 갱신
        this.updateNotice(pattern);

        // 문제 생성
        const generator = new ProblemGenerator(pattern, options);
        this.currentProblems = generator.generate(count);

        // 화면에 렌더링
        this.renderProblems(this.currentProblems);
      }

      updateNotice(pattern) {
        const types = pattern.tokens
          .filter(t => t.type !== 'operator' && t.type !== 'paren')
          .map(t => {
            if (t.type === 'integer') return `${t.digits}자리 정수`;
            if (t.type === 'decimal') return `소수(${t.intDigits}.${t.decDigits}자리)`;
            if (t.type === 'fraction') return `분수(${t.numDigits}/${t.denDigits})`;
            return '숫자';
          });

        const opStr = pattern.operators.map(op => {
          if (op === '*') return '×';
          if (op === '/') return '÷';
          return op;
        }).join(', ');

        const desc = `분석 완료: [${types.join(' & ')}] 연산 [${opStr || '단일'}] 패턴으로 생성 중`;
        this.dom.patternNotice.textContent = `🎯 ${desc}`;
      }

      renderProblems(problems) {
        this.dom.problemsContainer.innerHTML = '';

        problems.forEach((prob, index) => {
          const card = document.createElement('div');
          card.className = 'problem-card';

          card.innerHTML = `
            <div class="problem-header">
              <span class="problem-num">${index + 1}.</span>
              <div class="problem-expr">
                ${prob.exprHtml}
                <span class="math-op">=</span>
              </div>
            </div>
            <div class="problem-work-space"></div>
            <div class="problem-answer-line">
              <span>답:</span>
              <div class="answer-box">
                <span class="answer-val">${prob.answerHtml}</span>
              </div>
            </div>
          `;

          this.dom.problemsContainer.appendChild(card);
        });
      }
    }

    // 앱 초기화 실행
    document.addEventListener('DOMContentLoaded', () => {
      window.worksheetApp = new WorksheetApp();
    });
  </script>
</body>
</html>
